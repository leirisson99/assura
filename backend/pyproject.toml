[project]
name = "assura"
version = "0.1.0"
description = "Plataforma de gestão e auditoria de SGI"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "argon2-cffi",
    "pyjwt",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx2",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".specify", "specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
# A constituição pede exceções com nome do domínio (ex.: UltimoResponsavelNaoPodeSerRemovido),
# sem o sufixo "Error".
ignore = ["N818"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
